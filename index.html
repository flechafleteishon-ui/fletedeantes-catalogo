<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131313">
<meta name="description" content="Catálogo de Fletedeantes.">
<title>Fletedeantes</title>
<style>
:root{--bg:#131313;--panel:#222222;--ink:#f3f0e8;--muted:#aaa79f;--line:#454545;--accent:#f1e80c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
header{display:flex;justify-content:center;align-items:center;padding:30px 0 24px;border-bottom:1px solid var(--line)}
.logo{display:block;width:min(230px,55vw);height:auto;max-height:105px;object-fit:contain}
.intro{text-align:center;padding:44px 0 38px}
.intro p{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.catalog{padding:0 0 80px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.product{min-width:0}
.product-art{aspect-ratio:4/4.6;background:var(--panel);display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.product-art svg{width:100%;height:100%;max-height:250px}
.info{padding:15px 2px 0}
h2{font-size:1rem;font-weight:500;letter-spacing:.01em;margin:0 0 8px}
.price{font-size:.8rem;color:var(--muted)}
.buy{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);border:1px solid #777;padding:11px 12px;margin-top:14px;font-size:.72rem;letter-spacing:.04em;transition:background .2s,color .2s,border .2s}
.buy:hover{background:var(--accent);color:#202020;border-color:var(--accent)}
footer{border-top:1px solid var(--line);padding:18px 0 24px;text-align:center;color:var(--muted);font-size:.7rem;letter-spacing:.08em}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.intro{padding:34px 0 28px}.catalog{padding-bottom:55px}}
@media(max-width:380px){.wrap{width:calc(100% - 24px)}.product-art{padding:12px}.buy{font-size:.68rem;padding:10px 8px}}
</style>
</head>
